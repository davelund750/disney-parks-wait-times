<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WDW Wait Times</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-blocking so a slow or missing network at boot can't hold the page blank. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Grand+Hotel&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <nav class="park-tabs" id="parkTabs"></nav>
    <div class="topbar-right">
      <button class="view-toggle" id="viewToggle"></button>
      <button class="icon-button trip-date-icon" id="tripDateButton" aria-label="Set next trip date">
        <span class="cal-icon">
          <span class="cal-icon-header"></span>
          <span class="cal-icon-day" id="calIconDay"></span>
        </span>
      </button>
      <button class="icon-button settings-button" id="settingsButton" aria-label="Settings (press and hold)" title="Press and hold for settings">⚙&#xFE0E;</button>
      <div class="clock" id="clock">--:--</div>
    </div>
  </header>

  <main id="mainView">
    <div id="rideGrid" class="ride-grid" hidden>
      <div class="loading">Loading wait times…</div>
    </div>

    <div id="carousel" class="carousel" hidden>
      <div class="carousel-weather" id="carouselWeather" hidden></div>
      <div class="carousel-hours" id="carouselHours" hidden></div>

      <button class="carousel-nav prev" id="carouselPrev" aria-label="Previous ride">&#8249;</button>
      <button class="carousel-nav next" id="carouselNext" aria-label="Next ride">&#8250;</button>

      <div class="carousel-card" id="carouselCard">
        <div class="carousel-wordmark" id="carouselWordmark"></div>
        <div class="carousel-name" id="carouselName"></div>
        <button class="fav-star carousel-fav" id="carouselFav" hidden></button>
        <div class="carousel-wait" id="carouselWait">
          <span class="value"></span><span class="unit"></span>
        </div>
        <button class="ignore-btn carousel-ignore" id="carouselIgnore" hidden>− Ignore</button>
      </div>

      <div class="carousel-footer">
        <button class="carousel-play" id="carouselPlay" aria-label="Pause"></button>
        <div class="carousel-position" id="carouselPosition"></div>
      </div>
    </div>

    <!-- The resort's park landmarks (drawings in landmarks.js), which double
         as the park picker: tap one to show just that park. The selected park
         is filled in; on All Parks / Favorites, the carousel's current slide's
         park is. Built by buildSkyline() in app.js. -->
    <nav class="skyline" id="skyline" aria-label="Parks"></nav>
  </main>

  <footer class="statusbar">
    <span id="parkStatus"></span>
    <span id="tripCountdown" hidden></span>
    <span id="lastUpdated"></span>
  </footer>

  <div class="modal-overlay" id="dateModalOverlay" hidden>
    <div class="date-modal">
      <div class="date-modal-header">
        <button class="date-nav" id="monthPrev" aria-label="Previous month">&#8249;</button>
        <div class="date-modal-title" id="monthLabel"></div>
        <button class="date-nav" id="monthNext" aria-label="Next month">&#8250;</button>
      </div>
      <div class="date-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div class="date-grid" id="dateGrid"></div>
      <div class="date-modal-footer">
        <button class="date-modal-btn clear" id="clearTripDate">Clear</button>
        <button class="date-modal-btn cancel" id="closeDateModal">Cancel</button>
      </div>
    </div>
  </div>

  <!-- A grid card at full size, where a long name isn't cut off: opened by
       tapping the card, filled in by renderRideDetails() in app.js. -->
  <div class="modal-overlay" id="rideDetailsOverlay" hidden>
    <div class="carousel-card ride-details" role="dialog" aria-modal="true" aria-labelledby="rideDetailsName">
      <button class="ride-details-close" id="rideDetailsClose" aria-label="Close">✕</button>
      <div class="ride-details-park" id="rideDetailsPark"></div>
      <div class="carousel-name" id="rideDetailsName"></div>
      <button class="fav-star carousel-fav" id="rideDetailsFav"></button>
      <div class="carousel-wait" id="rideDetailsWait"></div>
      <button class="ignore-btn carousel-ignore" id="rideDetailsIgnore"></button>
    </div>
  </div>

  <script src="logic.js"></script>
  <script src="landmarks.js"></script>
  <script src="dragscroll.js"></script>
  <script src="app.js"></script>
</body>
</html>
