<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<!-- Must contain "WDW Wait Times": kiosk.sh treats a tab with that title as
     loaded, and would otherwise reload the dashboard partway through setup. -->
<title>WDW Wait Times – Setup</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Grand+Hotel&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="setup.css">
</head>
<body class="setup">
  <header class="setup-header">
    <div class="setup-wordmark" id="wordmark"></div>
    <div class="setup-progress" id="progress"></div>
    <button class="setup-cancel" id="cancel" hidden>Cancel</button>
  </header>

  <!-- Settings screen tabs (after setup); hidden during setup itself. -->
  <nav class="settings-tabs" id="tabs" hidden></nav>

  <main class="setup-main" id="step"></main>

  <!-- Hidden until a step fills it in, so a bare "Next" never shows. -->
  <footer class="setup-footer" id="footer" hidden>
    <button class="setup-btn secondary" id="back">Back</button>
    <button class="setup-btn primary" id="next">Next</button>
  </footer>

  <script src="logic.js"></script>
  <script src="landmarks.js"></script>
  <script src="dragscroll.js"></script>
  <script src="setup.js"></script>
</body>
</html>
